<svg viewBox="0 0 760 341" width="760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The steering loop: feedforward guides, action, feedback sensors, steer; and the four-step usage flow: triage, diagnose, prescribe, re-check">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
  </defs>

  <text x="380" y="32" font-size="16" text-anchor="middle" fill="#1e293b">The steering loop, and how you use this skill</text>

  <!-- Panel A: inner loop -->
  <text x="31" y="62" font-size="11" fill="#64748b">Inner loop — execution quality</text>

  <!-- row 1 arrows (y = box centre 101) -->
  <path d="M191,101 L 201,101" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M372,101 L 382,101" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M553,101 L 563,101" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row 1 boxes: y=74, h=54, w=155, gap=26 -->
  <rect x="31" y="74" width="155" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="108.5" y="96" font-size="12" text-anchor="middle" fill="#1e40af">Feedforward Guides</text>
  <text x="108.5" y="114" font-size="10" text-anchor="middle" fill="#1e40af">raise the odds</text>

  <rect x="212" y="74" width="155" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="289.5" y="96" font-size="12" text-anchor="middle" fill="#b45309">Action</text>
  <text x="289.5" y="114" font-size="10" text-anchor="middle" fill="#b45309">under constraint</text>

  <rect x="393" y="74" width="155" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="470.5" y="96" font-size="12" text-anchor="middle" fill="#166534">Feedback Sensors</text>
  <text x="470.5" y="114" font-size="10" text-anchor="middle" fill="#166534">evidence of done</text>

  <rect x="574" y="74" width="155" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="651.5" y="96" font-size="12" text-anchor="middle" fill="#6b21a8">Steer</text>
  <text x="651.5" y="114" font-size="10" text-anchor="middle" fill="#6b21a8">redo or escalate</text>

  <!-- loop-back: Steer → Guides (painted last, spans the row) -->
  <path d="M651.5,133 C651.5,190 108.5,190 108.5,139" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <text x="380" y="205" font-size="10" text-anchor="middle" fill="#64748b">adjust: continue, redo, or escalate</text>

  <!-- Panel B: usage flow -->
  <text x="31" y="250" font-size="11" fill="#64748b">How you use it — outer loop</text>

  <!-- row 2 arrows (y = box centre 289) -->
  <path d="M191,289 L 201,289" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M372,289 L 382,289" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M553,289 L 563,289" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row 2 boxes: y=262, h=54, w=155, gap=26 -->
  <rect x="31" y="262" width="155" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="108.5" y="284" font-size="12" text-anchor="middle" fill="#1e40af">1. Triage</text>
  <text x="108.5" y="302" font-size="10" text-anchor="middle" fill="#1e40af">20-point checklist</text>

  <rect x="212" y="262" width="155" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="289.5" y="284" font-size="12" text-anchor="middle" fill="#1e40af">2. Diagnose</text>
  <text x="289.5" y="302" font-size="10" text-anchor="middle" fill="#1e40af">14 failure modes</text>

  <rect x="393" y="262" width="155" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="470.5" y="284" font-size="12" text-anchor="middle" fill="#1e40af">3. Prescribe</text>
  <text x="470.5" y="302" font-size="10" text-anchor="middle" fill="#1e40af">8 playbook groups</text>

  <rect x="574" y="262" width="155" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="651.5" y="284" font-size="12" text-anchor="middle" fill="#1e40af">4. Re-check</text>
  <text x="651.5" y="302" font-size="10" text-anchor="middle" fill="#1e40af">no new smells</text>
</svg>
